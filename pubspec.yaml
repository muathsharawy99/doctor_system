name: doctor
description: "Doctor system — manage your patients."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flash: ^3.1.1
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  get_it: ^9.3.0
  lottie: ^3.3.1
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_gen:
  output: lib/gen/
  integrations:
    lottie: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie_files/
    - assets/translations/
